<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SmartMed Pharmacy - Customer Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#1b1b1b",
                    "inverse-surface": "#303030",
                    "on-primary-container": "#87a2ff",
                    "surface-container-low": "#f3f3f3",
                    "on-background": "#1b1b1b",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed-variant": "#444749",
                    "tertiary": "#242728",
                    "tertiary-fixed-dim": "#c5c6c8",
                    "inverse-primary": "#b5c4ff",
                    "secondary-fixed": "#d6e3ff",
                    "tertiary-fixed": "#e1e2e4",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#444652",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#e2e2e2",
                    "outline": "#747684",
                    "on-tertiary-fixed": "#191c1e",
                    "secondary-fixed-dim": "#b0c7f5",
                    "error-container": "#ffdad6",
                    "primary": "#001f66",
                    "inverse-on-surface": "#f1f1f1",
                    "surface-dim": "#dadada",
                    "secondary-container": "#b8cffe",
                    "surface-bright": "#f9f9f9",
                    "on-secondary-fixed-variant": "#30476e",
                    "secondary": "#485f87",
                    "surface-container-high": "#e8e8e8",
                    "surface-tint": "#3658ba",
                    "on-tertiary-container": "#a5a6a8",
                    "on-primary-fixed": "#00164e",
                    "primary-container": "#003296",
                    "surface": "#f9f9f9",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#b5c4ff",
                    "background": "#f9f9f9",
                    "surface-variant": "#e2e2e2",
                    "on-secondary-fixed": "#001b3e",
                    "outline-variant": "#c4c5d4",
                    "surface-container": "#eeeeee",
                    "on-primary-fixed-variant": "#173ea1",
                    "primary-fixed": "#dce1ff",
                    "on-secondary-container": "#425880",
                    "on-secondary": "#ffffff",
                    "tertiary-container": "#3a3c3e",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "accent-blue": "#B4CBF9"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "nav-width": "420px",
                    "nav-item-height": "40px",
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "container-padding": "24px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "label": ["Inter"],
                    "body-regular": ["Inter"],
                    "data-grid": ["Inter"],
                    "app-title": ["Inter"],
                    "section-header": ["Inter"]
            },
            "fontSize": {
                    "label": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "body-regular": ["14.6px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "data-grid": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "app-title": ["18.6px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "section-header": ["16px", {"lineHeight": "20px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c4c5d4;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #747684;
        }
        .modal-overlay {
            background-color: rgba(0, 31, 102, 0.4);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-background font-body-regular text-on-background min-h-screen flex items-center justify-center overflow-hidden bg-surface">
<!-- Background Content (Simulated Login Screen) -->
<!-- Registration Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" id="registrationModal">
<div class="bg-white w-[450px] h-[620px] shadow-[0px_4px_12px_rgba(0,0,0,0.1)] border border-outline-variant flex flex-col relative">
<!-- Modal Header -->
<header class="bg-primary px-gutter py-stack-md flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-on-primary text-[20px]">medical_services</span><h1 class="font-app-title text-app-title text-on-primary">SmartMed Pharmacy -&nbsp; Registration</h1></div><div class="flex items-center gap-4"><span class="material-symbols-outlined text-on-primary opacity-50 text-[20px]">lock</span><button class="text-on-primary hover:opacity-100 opacity-70 transition-opacity" onclick="closeModal()"><span class="material-symbols-outlined text-[20px]">close</span></button></div></header>
<!-- Modal Content (Scrollable if needed, but sized for content) -->
<form class="flex-1 p-gutter overflow-y-auto space-y-stack-md" id="registrationForm" onsubmit="handleRegistration(event)">
<div class="space-y-1">
<label class="font-label text-label text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full h-9 border-outline-variant border bg-white focus:border-primary focus:ring-0 px-2 text-body-regular transition-all outline-none" id="fullName" placeholder="John Doe" required="" type="text">
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="font-label text-label text-on-surface-variant" for="email">Email</label>
<input class="w-full h-9 border-outline-variant border bg-white focus:border-primary focus:ring-0 px-2 text-body-regular transition-all outline-none" id="email" placeholder="john@example.com" required="" type="email">
</div>
<div class="space-y-1">
<label class="font-label text-label text-on-surface-variant" for="phone">Phone</label>
<input class="w-full h-9 border-outline-variant border bg-white focus:border-primary focus:ring-0 px-2 text-body-regular transition-all outline-none" id="phone" placeholder="(555) 000-0000" required="" type="tel">
</div>
</div>
<div class="space-y-1">
<label class="font-label text-label text-on-surface-variant" for="address">Address</label>
<textarea class="w-full border-outline-variant border bg-white focus:border-primary focus:ring-0 px-2 py-1 text-body-regular transition-all outline-none resize-none" id="address" placeholder="123 Medical Way, Health City" required="" rows="2"></textarea>
</div>
<div class="space-y-1">
<label class="font-label text-label text-on-surface-variant" for="password">Password</label>
<div class="relative"><input class="w-full h-9 border-outline-variant border bg-white focus:border-primary focus:ring-0 px-2 pr-10 text-body-regular transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"><button class="absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" type="button" aria-label="Toggle password visibility"><span class="material-symbols-outlined text-[20px]">visibility</span></button></div>
</div>
<div class="space-y-1">
<label class="font-label text-label text-on-surface-variant" for="confirmPassword">Confirm Password</label>
<input class="w-full h-9 border-outline-variant border bg-white focus:border-primary focus:ring-0 px-2 text-body-regular transition-all outline-none" id="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Footer Actions -->
<div class="pt-4 space-y-stack-sm border-t border-outline-variant mt-stack-md"><button class="w-full h-10 bg-accent-blue hover:brightness-95 text-on-primary-fixed font-label rounded-sm transition-all active:scale-[0.98] flex items-center justify-center gap-2 mb-2" type="submit">Register</button><button class="w-full h-10 bg-surface-container hover:bg-surface-container-high text-on-surface font-label border border-outline-variant rounded-sm transition-all active:scale-[0.98]" onclick="closeModal()" type="button">Cancel</button></div>
</form>
<!-- Success Overlay -->
<div class="absolute inset-0 bg-white z-[60] flex flex-col items-center justify-center p-8 text-center hidden animate-in fade-in zoom-in duration-300" id="successMessage">
<div class="w-16 h-16 bg-secondary-fixed rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-[32px]">check_circle</span>
</div>
<h2 class="font-section-header text-section-header text-primary mb-2">Registration successful</h2>
<p class="text-on-surface-variant text-body-regular mb-8">You can now login to your SmartMed Pharmacy portal to manage prescriptions and orders.</p>
<button class="w-full h-10 bg-primary text-on-primary font-label hover:bg-primary-container transition-colors" onclick="goToLogin()">
                    Return to Login
                </button>
</div>
</div>
</div>
<script>
        function closeModal() {
            const modal = document.getElementById('registrationModal');
            modal.style.display = 'none';
        }

        function handleRegistration(event) {
            event.preventDefault();
            
            // Basic validation
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            
            if (pass !== confirmPass) {
                alert('Passwords do not match');
                return;
            }

            // Show success message
            const successOverlay = document.getElementById('successMessage');
            successOverlay.classList.remove('hidden');
        }

        function goToLogin() {
            // Simulate navigation back to login
            location.reload();
        }

        // Add visual cues for focus states on inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#001f66';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '#444652';
            });
        });
    </script>


</body></html>
