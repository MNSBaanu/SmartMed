<!-- Micro-interaction Script -->
<script>
        // Simple scale effect for primary button
        document.querySelector('button.bg-secondary-fixed-dim').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Saving...';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Saved';
                btn.classList.remove('bg-secondary-fixed-dim');
                btn.classList.add('bg-green-100', 'text-green-800');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.add('bg-secondary-fixed-dim');
                    btn.classList.remove('bg-green-100', 'text-green-800', 'opacity-80', 'pointer-events-none');
                }, 2000);
            }, 1200);
        });

        // Close logic simulation
        document.querySelector('.material-symbols-outlined[content="close"]').closest('button').addEventListener('click', () => {
            document.querySelector('.modal-overlay').style.display = 'none';
        });
    </script>
